schema_version: 1

id: lk_apps
name: Example Apps

description: >
  Example SaaS application for workshop, inventory,
  and administration workflows.

technologies:
  - nodejs
  - typescript
  - express
  - mysql
  - redis

roots:
  - id: backend
    path: /projects/lk_apps
    type: source_code
    include:
      - apps/**/*.ts
      - apps/**/*.js
      - src/**/*.ts
  - id: architecture
    path: /projects/lk_apps/.devdoc
    type: architecture_docs
    include:
      - "**/*.md"

instructions:
  - Read relevant architecture documentation before large changes.
  - Prefer existing code patterns over inventing new ones.
  - Verify conclusions against source code and tests.

relationships:
  - target: shared-auth
    type: depends_on

tags:
  - backend
  - saas
  - multi-tenant
