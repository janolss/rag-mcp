[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp"
version = "0.1.0"
description = "Local workspace RAG MCP toolkit"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3.0,<3",
  "qdrant-client>=1.19.1,<2",
  "httpx>=0.28.1,<1",
  "pyyaml>=6.0.3,<7",
  "python-dotenv>=1.2.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10"]

[project.scripts]
rag-mcp = "rag.mcp_server:main"
rag-cli = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]
