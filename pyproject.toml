[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp"
version = "0.5.0"
description = "Local workspace RAG MCP toolkit"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3.0,<3",
  "qdrant-client>=1.20.0,<2",
  "httpx>=0.28.1,<1",
  "pyyaml>=6.0.3,<7",
  "python-dotenv>=1.2.4,<2",
  "pydantic>=2.14.3,<3",
  "starlette>=1.10.0,<2",
  "uvicorn>=0.30,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.9,<1",
]
cli = ["mcp[cli]>=2.3.0,<3"]
formats = [
  "pypdf>=6.19.0,<7",
  "python-docx>=1.1,<2",
]
parsers = [
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.26",
]

[project.scripts]
rag-mcp = "rag.mcp_server:main"
rag-cli = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
rag = ["gui/*.html", "gui/*.css", "gui/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["rag", "tests", "run_mcp.py"]
exclude = [
  ".venv",
  "qdrant_data",
  "dist",
  "build",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "SIM105",
  "SIM108",
  "SIM110",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
