# Copy to config.yaml and adjust for your workspace.
# Priority: CLI flags > RAG_* env vars > this file > defaults.
#
# Unpack layout: place this package as <workspace>/rag-mcp/ so repo_root ".."
# points at the workspace you want to index.

mcp:
  name: "workspace-rag"
  instructions: |
    You have access to a private RAG index for this workspace (requirements/docs + code).

    Workflow (mandatory):
    1. Call index_status before non-trivial change or review work. If the index is empty, missing, model-mismatched, or git_sha is far behind the user's branch, warn the user to re-index.
    2. For scoped app work, call list_sources (or use known apps) and pass app=<name> to code tools.
    3. Before implementing a change: call get_context_pack(task) or impact_of_change(change). Do not invent architecture from memory.
    4. When a requirement ID or requirement text is given: call trace_requirement first.
    5. For PR/review quality: use prompt pr-review or call find_gaps on the affected area; require explicit requirement→code→test links; state gaps clearly.
    6. Prefer search_knowledge for docs/architecture and search_code for implementation details when you need targeted follow-ups after a context pack.

    Rules:
    - Cite file paths (and line ranges when present) from tool results.
    - If scores are weak or tools return no hits, say so and ask for a better query or re-index — do not guess.
    - On Qdrant lock errors: tell the user to stop the indexer or switch qdrant.mode to server (team: prefer server mode).
    - Do not claim the index is complete coverage; find_gaps is heuristic.

embedding:
  # openai → /v1/embeddings (LM Studio, Paddock, OpenAI-compatible)
  # ollama → /api/embeddings (native Ollama; use base_url .../api/embed for batched API)
  provider: "openai"
  base_url: "http://localhost:1234/v1"
  api_key: "local"
  model: "text-embedding-nomic-embed-text-v1.5"
  # Optional model-specific prefixes (e.g. Nomic search_document: / search_query:)
  document_prefix: ""
  query_prefix: ""
  timeout_ms: 60000
  batch_size: 32
  # Truncate pathologically large inputs before calling the API (0 = disabled)
  max_input_chars: 6000
  # Parallel embedding HTTP calls (raise for faster Ollama indexing; watch GPU/CPU load)
  concurrency: 4

  # Example — Ollama native:
  # provider: "ollama"
  # base_url: "http://localhost:11434"
  # model: "nomic-embed-text:v1.5"

qdrant:
  mode: "local" # local | memory | server
  local_path: "./qdrant_data"
  url: "http://localhost:6333"
  # Use a unique collection name per workspace
  collection: "workspace_rag"
  # Local mode allows only one process. Retries help Cursor reconnect races.
  connect_retries: 10
  connect_retry_delay_ms: 500

index:
  # Relative to this package root (rag-mcp/). ".." = parent workspace.
  repo_root: ".."
  # knowledge | code | all
  sources: "all"
  chunk_size: 1200
  chunk_overlap: 150
  status_file: "./index_status.json"

  # Globs relative to repo_root (list separate patterns; brace expansion is not supported)
  # Tip: include docs/requirements/**/*.md and .devdoc/**/ADR*.md when present.
  knowledge:
    - "README.md"
    - "readme.md"
    - "docs/**/*.md"
    - ".devdoc/**/*.md"
    - "documentation/**/*.md"
  code:
    - "src/**/*.ts"
    - "src/**/*.js"
    - "src/**/*.py"
    - "apps/**/*.ts"
    - "apps/**/*.js"
    - "apps/**/*.py"
    - "apps/**/*.ejs"

  # Optional: path prefix → app label for search_code(app=...)
  apps:
    - prefix: "apps/web/"
      name: "web"
    - prefix: "apps/taskscheduler/"
      name: "taskscheduler"

  documentation_prefixes:
    - ".devdoc/"
    - "docs/"
    - "documentation/"

  # Extracted into chunk.requirement_ids at index time (trace_requirement)
  requirement_id_patterns:
    - "REQ-\\d+"
    - "KR-\\d+"
    - "US-\\d+"

  ignore_dirs:
    - node_modules
    - dist
    - coverage
    - build
    - .git
    - .venv
    - venv
    - __pycache__
    - .turbo
    - .next
    - qdrant_data

search:
  top_k: 8
  score_threshold: 0.2
  # Hybrid re-rank: final = vector_weight * vector + lexical_weight * lexical
  vector_weight: 0.7
  lexical_weight: 0.3

log_level: "INFO"
